name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # STAGE 1: Fast feedback (Test & Lint)
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Test Backend (Django)
        run: |
          cd backend
          pip install -r requirements.txt
          # Run Django checks to ensure code is valid
          python manage.py check
          # If we had unit tests, we would run: python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test Frontend Build
        run: |
          cd frontend
          npm ci
          # A successful build acts as our frontend test for now
          npm run build

  # STAGE 2: Build and Push Docker Images
  build-and-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub

      # Convert github.repository to lowercase to avoid Docker naming errors
      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }} # Only push if merging to main
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}-backend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.REPO }}-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.REPO }}-frontend:latest
          build-args: |
            VITE_API_URL=/api

  # STAGE 3: Actual EC2 Deployment
  deploy:
    name: Deploy to EC2 Production
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Ensure project directory exists
            mkdir -p ~/kamka-app
            cd ~/kamka-app
            
            # 2. Download the latest docker-compose.prod.yml and Caddyfile directly from GitHub
            wget -qO docker-compose.prod.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml
            wget -qO Caddyfile https://raw.githubusercontent.com/${{ github.repository }}/main/Caddyfile
            
            # 3. Export environment variables for Docker Compose
            export GHCR_BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/kamka-devops-assessment-backend:latest
            export GHCR_FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/kamka-devops-assessment-frontend:latest
            
            # Ensure images are lowercased
            export GHCR_BACKEND_IMAGE=$(echo $GHCR_BACKEND_IMAGE | tr '[:upper:]' '[:lower:]')
            export GHCR_FRONTEND_IMAGE=$(echo $GHCR_FRONTEND_IMAGE | tr '[:upper:]' '[:lower:]')

            # 4. Log in to GHCR to pull the private/public images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 5. Pull new images and deploy with zero downtime where possible
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 6. Clean up old unused images to save EC2 disk space
            docker image prune -af